<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Leistung – Lern-App (Prototyp)</title>
<style>
:root{
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono',SFMono-Regular,Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r:14px;
  --pop-yellow:#fed835;--pop-pink:#fb55b1;--pop-cyan:#36dcec;--pop-green:#49de78;--ink:#161332;
  --bg:#f3f4ff;--surface:#fdfdff;--subtle:#e6e7ff;--text:#181535;--muted:#4a486d;
  --line:#1f174a;--line-soft:#babadd;--primary:#6442e4;--on-primary:#fbfbff;
  --accent-text:#502cbe;--accent-bg:#e3e4ff;
  --good:#005928;--good-bg:#c1f7d2;--bad:#a90017;--bad-bg:#ffdfda;--warn:#784000;--warn-bg:#ffeea0;
  --header-bg:#2f127b;--header-text:#fbfbff;--header-muted:#ccccf8;--header-line:#6358ba;
  --bar-track:#d4d4f5;--bar-fill:#745af4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#120e2d;--surface:#1f1a43;--subtle:#181439;--text:#f4f4fd;--muted:#c0c0e4;
    --line:#9d99ed;--line-soft:#3e3a70;--primary:#a89fff;--on-primary:#141030;
    --accent-text:#c9c6ff;--accent-bg:#2d2560;
    --good:#5eee9c;--good-bg:#00361a;--bad:#ffa59c;--bad-bg:#4f1a18;--warn:#f6da6f;--warn-bg:#3e2e00;
    --header-bg:#0a0427;--bar-track:#373267;--bar-fill:#aea5ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#120e2d;--surface:#1f1a43;--subtle:#181439;--text:#f4f4fd;--muted:#c0c0e4;
  --line:#9d99ed;--line-soft:#3e3a70;--primary:#a89fff;--on-primary:#141030;
  --accent-text:#c9c6ff;--accent-bg:#2d2560;
  --good:#5eee9c;--good-bg:#00361a;--bad:#ffa59c;--bad-bg:#4f1a18;--warn:#f6da6f;--warn-bg:#3e2e00;
  --header-bg:#0a0427;--bar-track:#373267;--bar-fill:#aea5ff;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:500;font-size:1.0625rem;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header-bg)}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono)}.b{font-weight:800}
.small{font-size:.875rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:720px;margin:0 auto;padding:var(--s5) var(--s4) var(--s7)}
.tag{font-size:.8rem;font-weight:800;color:var(--accent-text)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}

.top{position:relative;overflow:hidden;background:radial-gradient(circle at 88% 18%,rgba(165,0,145,.55),transparent 42%),radial-gradient(circle at 6% 92%,rgba(0,131,199,.5),transparent 46%),var(--header-bg);color:var(--header-text);padding:var(--s5) var(--s4);border-bottom:4px solid var(--line)}
.top>*{position:relative;max-width:688px;margin-left:auto;margin-right:auto}
.hero{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,8vw,3rem);line-height:1.02;text-shadow:0 3px 0 #150640;overflow-wrap:anywhere}
.lead{color:var(--header-muted);margin-top:var(--s2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s5)}
.stat{border:3px solid var(--header-line);border-radius:14px;background:rgba(255,255,255,.08);padding:var(--s3);display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:.75rem;font-weight:800;color:var(--header-muted)}
.stat .v{font-family:var(--font-display);font-weight:600;font-size:1.125rem}
.chip{display:inline-block;margin-top:var(--s3);padding:2px 12px;border-radius:999px;background:var(--pop-pink);color:var(--ink);border:3px solid var(--line);font-weight:800;font-size:.85rem}

.card{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);box-shadow:0 5px 0 var(--line);padding:var(--s4)}
.path{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.chap{display:grid;grid-template-columns:50px 1fr;gap:var(--s3);align-items:start;border-top:12px solid var(--sc,var(--primary))}
.chap.locked{border-style:dashed;box-shadow:none;background:var(--subtle);opacity:.8}
.num{width:50px;height:50px;border-radius:14px;background:var(--sc,var(--primary));color:var(--ink);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:1.6rem}
.chap h3,.lh,.sumh{font-family:var(--font-display);font-weight:600;font-size:1.375rem;line-height:1.2}
.sub{color:var(--accent-text);font-weight:700;font-size:.9rem}
.acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

.btn{appearance:none;min-height:52px;padding:0 var(--s4);border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font:800 1rem/1.1 var(--font-body);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn.sm{min-height:40px;padding:0 var(--s3);font-size:.875rem;box-shadow:0 3px 0 var(--line)}
.btn.block{display:block;width:100%;margin-top:var(--s3)}
.btn:disabled{opacity:.4;box-shadow:none;transform:none;cursor:default}
.btn.on{background:var(--primary);color:var(--on-primary)}
.seg3{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s3) 0}
.seg3 .btn{flex:1;min-width:90px}

.bar{height:14px;border:3px solid var(--line);border-radius:8px;background:var(--bar-track);overflow:hidden;margin:var(--s3) 0}
.bar>div{height:100%;background:var(--pop-yellow);transition:width .5s}
.qcard{border-top:12px solid var(--sc,var(--primary));margin-top:var(--s4)}
.q{font-weight:800;font-size:1.25rem;line-height:1.3;margin:var(--s2) 0 var(--s4)}
.lbody p{margin:0 0 var(--s3)}
.opts{display:flex;flex-direction:column;gap:var(--s3)}
.opt{appearance:none;display:flex;gap:var(--s3);align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:var(--s3) var(--s4);border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font:600 1rem/1.35 var(--font-body);cursor:pointer;box-shadow:0 4px 0 var(--line-soft)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sc,var(--primary));color:var(--ink);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.opt:disabled{cursor:default;opacity:.75}
.opt.good{opacity:1;background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad{opacity:1;background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.ansrow{display:flex;gap:var(--s3);align-items:stretch}
.numin{flex:1;min-width:0;min-height:60px;padding:0 var(--s4);border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font:800 1.5rem var(--font-mono)}
.unitl{display:flex;align-items:center;min-width:3em;font-size:1.25rem;font-weight:800;color:var(--accent-text)}
.fb{margin-top:var(--s4);border:3px solid;border-radius:14px;padding:var(--s4)}
.fb .fbt{font-weight:800;margin-bottom:var(--s1)}
.fb.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.fb .fbb{color:var(--text);font-size:.95rem}
.fb .btn{margin-top:var(--s3)}
.merk{display:flex;gap:var(--s3);border:3px solid var(--primary);background:var(--accent-bg);border-radius:14px;padding:var(--s3);margin:var(--s3) 0}
.mk{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pop-yellow);color:var(--ink);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.worked{border:3px solid var(--line);border-radius:14px;background:var(--subtle);padding:var(--s3);margin:var(--s3) 0}
.wsteps{list-style:none;margin:var(--s2) 0 var(--s3);padding:0}
.wsteps li{padding:10px 0;border-top:2px dashed var(--line-soft)}
.wsteps li.hid{display:none}
.wt{font-weight:800}.wm{font-family:var(--font-mono);font-size:.9rem}
.audio{margin-top:var(--s4);border-top:2px dashed var(--line-soft);padding-top:var(--s3)}
.audio .tag{display:block;margin-bottom:var(--s1)}
.script{margin:var(--s3) 0 0;padding:0;list-style:none;font-size:.9rem}
.script li{padding:6px 10px;border-radius:10px;margin:4px 0;background:var(--subtle)}
.script li.f{background:var(--accent-bg)}
.script b{font-size:.78rem;color:var(--accent-text)}
.sim{border:3px solid var(--line-soft);border-radius:14px;padding:var(--s3);background:var(--subtle)}
.sl{display:block;margin-top:var(--s3)}
.sll{display:block;font-weight:700;font-size:.875rem}
input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--primary)}
.sw{font:800 2.6rem var(--font-mono);text-align:center;margin:var(--s3) 0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3)}
.trio>div{background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;min-width:0}
.trio .k{font-size:.72rem;font-weight:800;color:var(--muted)}
.readout{font-size:.9rem;background:var(--surface);border:3px solid var(--line-soft);border-radius:14px;padding:var(--s3);margin-top:var(--s3)}
.dots{display:flex;gap:6px;margin:var(--s3) 0}
.dot{flex:1;height:10px;border-radius:5px;background:var(--bar-track)}.dot.on{background:var(--sc,var(--bar-fill))}
.navrow{display:grid;grid-template-columns:1fr 2fr;gap:var(--s3);margin-top:var(--s4)}
.tags{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.review{background:var(--accent-bg)}
.note{border-left:6px solid var(--pop-pink);padding-left:var(--s3);margin-top:var(--s3)}
.qrbox{background:#fff;padding:8px;border:3px solid var(--line);border-radius:14px;margin-top:12px;display:flex;justify-content:center}.qrbox svg{width:100%;max-width:360px;height:auto;display:block}
.codebox{font-family:var(--font-mono);font-size:.75rem;word-break:break-all;border:3px dashed var(--line);border-radius:14px;padding:var(--s3);margin-top:var(--s3);user-select:all}
.xppop{float:right;background:var(--pop-yellow);color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:0 12px;font-family:var(--font-display);font-weight:700}

.watti{--w:64px;position:relative;width:var(--w);display:flex;flex-direction:column;align-items:center;animation:idle 3.4s ease-in-out infinite}
.watti.mini{--w:46px;position:absolute;right:16px;top:calc(var(--w)*-1.5)}
.watti .cap{width:calc(var(--w)*.34);height:calc(var(--w)*.11);background:var(--line);border-radius:4px 4px 0 0}
.watti .body{position:relative;width:var(--w);height:calc(var(--w)*1.3);border:3px solid var(--line);border-radius:calc(var(--w)*.26);background:#f3f4ff;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.watti .fill{position:absolute;left:0;right:0;bottom:0;height:var(--lvl);background:var(--pop-yellow);transition:height 1s}
.watti .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--w)*.1)}
.watti .eyes{display:flex;gap:calc(var(--w)*.2)}
.watti .eye{display:block;width:calc(var(--w)*.13);height:calc(var(--w)*.19);background:var(--ink);border-radius:50%}
.watti .mouth{display:block;width:calc(var(--w)*.3);height:calc(var(--w)*.14);border:3px solid var(--ink);border-top:none;border-radius:0 0 calc(var(--w)*.3) calc(var(--w)*.3)}
.watti[data-mood=cheer] .mouth{height:calc(var(--w)*.2);background:var(--ink)}
.watti[data-mood=sad] .mouth{border:3px solid var(--ink);border-bottom:none;border-radius:calc(var(--w)*.3) calc(var(--w)*.3) 0 0}
.watti[data-mood=think] .mouth{border:0;border-bottom:3px solid var(--ink);border-radius:0;height:0;width:calc(var(--w)*.2)}
.watti.talk{animation:hop .5s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

    q=c;
  }
  if(!q)q=rnd(GEN[S.niv])();
  ui.lastTopic=q.topic;
  S.recentQ=recent.concat([q.q]).slice(-40);
  if(q.kind==='mc')q.shown=shuffle(q.opts.map((t,i)=>({t,ok:i===0,h:(q.hints&&q.hints[i])||null})));

}
function record(ok){
  S.hist.push(ok?1:0);
  S.log.push({n:S.niv,ok:ok?1:0});if(S.log.length>300)S.log.shift();
  if(S.hist.length>=6){
    const sum=S.hist.slice(-6).reduce((a,b)=>a+b,0);
    if(sum===6&&S.niv<3){S.niv++;S.hist=[];}
    else if(sum<=3&&S.niv>1){S.niv--;S.hist=[];}
    else if(S.hist.length>8)S.hist=S.hist.slice(-8);
  }
}

function note(t){let n=$('note');if(!n){n=document.createElement('div');n.id='note';n.setAttribute('role','status');n.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--warn-bg);color:var(--warn);border:3px solid var(--warn);border-radius:14px;padding:12px;font-weight:700';document.body.appendChild(n);}n.textContent=t;clearTimeout(n._t);n._t=setTimeout(()=>{n.remove();},6000);}
function stopAll(){tok++;try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}if(cur){try{cur.pause();}catch(e){}cur=null;}talk(false);}
function talk(on){document.querySelectorAll('.watti').forEach(w=>w.classList.toggle('talk',on));}
function voicePick(kind){
  let v=[];try{v=speechSynthesis.getVoices().filter(x=>/^de/i.test(x.lang));}catch(e){}
  const fem=/anna|petra|marlene|vicki|katja|helena|female|weiblich/i,mal=/markus|hans|yannick|stefan|conrad|male|männlich/i;
  let pick=null;
  if(kind==='f')pick=v.find(x=>fem.test(x.name));
  else if(kind==='m')pick=v.find(x=>mal.test(x.name));
  return pick||v[0]||null;
}
function tts(text,kind,done){
  if(!('speechSynthesis' in window)){note('Dieses Gerät oder diese Ansicht kann nicht vorlesen. Öffne die Seite direkt im Browser.');done();return;}
  const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';
  const v=voicePick(kind);if(v)u.voice=v;
  u.pitch=kind==='m'?.8:kind==='f'?1.15:1.25;u.rate=1.02;u.volume=1;
  u.onend=done;
  u.onerror=e=>{if(!e||(e.error!=='canceled'&&e.error!=='interrupted'))note('Vorlesen wurde blockiert. Prüfe Lautstärke und Stumm-Schalter, oder öffne die Seite direkt im Browser.');done();};
  speechSynthesis.speak(u);
}
function playClip(id,text,kind,myTok){
  return new Promise(res=>{
    if(myTok!==tok)return res();
    const src=AUDIO_URLS[id]||(HAS_AUDIO?'audio/'+id+'.mp3':null);
    if(!src){tts(text,kind,res);return;}
    let fell=false;
    const a=new Audio(src);cur=a;
    const fb=()=>{if(fell)return;fell=true;if(myTok!==tok)return res();tts(text,kind,res);};
    a.addEventListener('error',fb);a.addEventListener('ended',()=>res());
    const p=a.play();if(p&&p.catch)p.catch(fb);
  });
}
async function playSeq(items){
  stopAll();const my=tok;talk(true);
  for(const it of items){if(my!==tok)return;await playClip(it.id,it.text,it.kind,my);}
  if(my===tok)talk(false);
}

function viewDone(){
  return '<main class="wrap"><section class="card"><div style="float:right">'+watti(100,'cheer','big')+'</div><h2 class="sumh">Lektion geschafft.</h2><p style="margin:12px 0">'+(ui.gain?'<span class="mono b">+'+ui.gain+' XP</span> für die Lektion.':'Die Punkte gab es schon beim ersten Mal.')+'</p><p class="small">Jetzt wendest du das Gelernte in einer Übungsrunde an.</p></section>'+
  '<button class="btn btn-primary block" data-act="practice" '+(canPractice()?'':'disabled')+'>Jetzt üben</button><button class="btn block" data-act="home">Zum Lernpfad</button></main>';
}

function render(){
  stopAll();
  $('app').innerHTML=ui.screen==='home'?viewHome():ui.screen==='lesson'?viewLesson():ui.screen==='round'?viewRound():ui.screen==='summary'?viewSummary():viewDone();
  const sr=$('sr'),mr=$('mr');
  if(mr)mr.addEventListener('input',()=>{ui.sp.m=+mr.value;$('mv').textContent=ui.sp.m;});
  if(sr)sr.addEventListener('input',()=>{ui.sp.st=+sr.value;$('sv').textContent=ui.sp.st;$('hv').textContent=fmt(ui.sp.st*0.18,2);});
  if(ui.screen==='round'&&ui.R.q.kind==='num'&&!ui.R.done){const a=$('ans');if(a)setTimeout(()=>a.focus(),30);}
  if(ui.screen!=='home'||true)window.scrollTo(0,0);
}

/* ---------- Üben ---------- */
function startRound(){
  ui.R={n:8,i:0,c:0,xp:0,missed:[],q:null,done:false,tries:0,hint:false,input:'',fb:null,sel:null,usedHint:false};
  ui.R.q=nextQuestion();ui.screen='round';render();
}
function parseNum(s){s=String(s).trim().replace(/[\s\u202F\u2019']/g,'').replace(',','.');return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;}
function finishQ(ok,first){
  const R=ui.R;R.done=true;
  const firstTry=first&&!R.usedHint;
  record(firstTry);
  if(firstTry)R.c++;else R.missed.push(TIPPS[R.q.topic].split('.')[0]);
  const gain=firstTry?10:R.tries||R.usedHint?5:0;
  if(ok){R.xp+=gain;}
  R.sayIds=ok?[rnd(FB_OK)]:[rnd(FB_BAD),'tipp-'+R.q.topic];
}
function answerMC(i){
  const R=ui.R;if(R.done)return;R.sel=i;const o=R.q.shown[i],ok=o.ok;
  finishQ(ok,true);
  if(!ok&&o.h){S.errs=S.errs||{};S.errs[o.h]=(S.errs[o.h]||0)+1;R.sayIds=[hintClip(o.h)];}
  R.fb=ok?{k:'good',t:'Richtig.',b:R.q.expl,xp:R.usedHint?5:10}:{k:'bad',t:'Nicht ganz.',b:(o.h?hintText(o.h)+'<br>':'')+R.q.expl};
  render();
}
function checkNum(){
  const R=ui.R,q=R.q;if(R.done)return;
  const el=$('ans');R.input=el?el.value:R.input;
  const x=parseNum(R.input);
  if(isNaN(x)){R.fb={k:'warn',t:'Gib eine Zahl ein.',b:'Zum Beispiel 120 oder 2,5.'};render();return;}
  const ok=Math.abs(x-q.ans)<=Math.max(Math.abs(q.ans)*q.tol,0.05);
  const tr=ok?null:matchTrap(q,x);
  if(tr){S.errs=S.errs||{};S.errs[tr]=(S.errs[tr]||0)+1;}
  if(ok){finishQ(true,R.tries===0);R.fb={k:'good',t:R.tries?'Richtig im zweiten Versuch.':'Richtig.',b:q.expl,xp:R.tries||R.usedHint?5:10};}
  else if(R.tries===0){
    R.tries=1;
    if(tr){R.hint=false;R.fb={k:'warn',t:'Noch nicht, aber du bist nah dran.',b:TRAPS[tr]+' Versuche es nochmals.'};R.sayIds=['trap-'+tr];}
    else{R.hint=true;R.usedHint=true;R.fb={k:'warn',t:'Noch nicht.',b:'Du hast noch einen Versuch.'};R.sayIds=[rnd(FB_BAD),'tipp-'+q.topic];}
  }
  else{finishQ(false,false);R.fb={k:'bad',t:'Nicht ganz.',b:'Richtig wäre '+fmt(q.ans,2)+' '+q.unit+'.<br>'+(tr?TRAPS[tr]+'<br>':'')+q.expl};if(tr)R.sayIds=['trap-'+tr];}
  render();
}
function nextQ(){
  const R=ui.R;R.i++;
  if(R.i>=R.n){bump(R.xp+(R.c>=R.n-1?10:0));S.rounds++;save();R.xp+=R.c>=R.n-1?10:0;ui.screen='summary';render();return;}
  Object.assign(R,{q:nextQuestion(),done:false,tries:0,hint:false,input:'',fb:null,sel:null,usedHint:false,sayIds:null});
  save();render();
}
function sayList(ids){
  playSeq(ids.map(id=>{const c=CLIPS[id];return {id,text:c?c.text:'',kind:'w'};}));
}

/* ---------- Sprint ---------- */
let swTimer=null;
function swStart(){
  const sp=ui.sp;sp.run=true;sp.t0=performance.now();sp.t=null;render();
  swTimer=setInterval(()=>{const el=$('sw');if(el)el.textContent=((performance.now()-sp.t0)/1000).toFixed(1)+' s';},100);
}
function measure(t,m,st){
  const h=st*0.18,W=m*10*h;
  S.sprint={m,h,t:Math.max(1,t),W,P:W/Math.max(1,t)};
  ui.sp.t=S.sprint.t;
  if(!S.seen[ui.ci])S.seen[ui.ci]=true;
  bump(10);save();render();
}
function swStop(){
  clearInterval(swTimer);const sp=ui.sp,t=(performance.now()-sp.t0)/1000;sp.run=false;
  measure(Math.round(t*10)/10,sp.m,sp.st);
}

/* ---------- Lernstand-Code: verschlüsselt (ECDH P-256 + AES-GCM) ---------- */
const TPUB={"kty":"EC","crv":"P-256","x":"2V_58k0J7JKikbS7iQcPJOLCgrtGohyEEVU8c0qgYV8","y":"RuVDwRWtXBezY2Qm-rczlgs0XyeU0LOzR00c4MCDLFc"};
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
function payload(){
  const last=S.log.slice(-30),acc=last.length?Math.round(last.reduce((a,b)=>a+b.ok,0)/last.length*100):null;
  const e={};Object.keys(S.errs||{}).sort((p,q)=>S.errs[q]-S.errs[p]).slice(0,3).forEach(k=>{e[k]=S.errs[k];});
  const o={v:2,n:S.nick,x:S.xp,r:S.rounds,g:S.niv,a:acc,l:S.lesson?1:0,s:S.sprint?Math.round(S.sprint.P):null,i:Math.floor(Date.now()/1000)};
  if(Object.keys(e).length)o.e=e;
  return o;
}
async function makeCode(){
  const c=window.crypto&&window.crypto.subtle;if(!c)throw new Error('nocrypto');
  const eph=await c.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
  const tp=await c.importKey('jwk',TPUB,{name:'ECDH',namedCurve:'P-256'},false,[]);
  const bits=await c.deriveBits({name:'ECDH',public:tp},eph.privateKey,256);
  const key=await c.importKey('raw',await c.digest('SHA-256',bits),{name:'AES-GCM'},false,['encrypt']);
  const iv=window.crypto.getRandomValues(new Uint8Array(12));
  const pt=new TextEncoder().encode(JSON.stringify(payload()));
  const ct=new Uint8Array(await c.encrypt({name:'AES-GCM',iv:iv},key,pt));
  const pub=new Uint8Array(await c.exportKey('raw',eph.publicKey));
  const out=new Uint8Array(pub.length+12+ct.length);out.set(pub,0);out.set(iv,pub.length);out.set(ct,pub.length+12);
  return 'LP2.'+b64u(out);
}
function qrSvg(text){const q=qrcode(0,'L');q.addData(text,'Byte');q.make();return q.createSvgTag({scalable:true,margin:2});}

/* ---------- Eingaben ---------- */
function onAct(b){
  const a=b.dataset.act,i=ui.ci;
  if(a==='home'){ui.screen='home';ui.code=null;ui.qr=null;render();}
  else if(a==='learn'){ui.screen='lesson';ui.ci=0;S.seen[0]=S.seen[0]||false;render();}
  else if(a==='lnext'){S.seen[ui.ci]=true;ui.ci=Math.min(CARDS.length-1,ui.ci+1);save();render();}
  else if(a==='lprev'){ui.ci=Math.max(0,ui.ci-1);render();}
  else if(a==='lfinish'){S.seen[ui.ci]=true;ui.gain=0;if(!S.lesson){S.lesson=true;ui.gain=15;bump(15);}save();ui.screen='done';render();}
  else if(a==='mode'){ui.mode[i]=b.dataset.m;render();}
  else if(a==='play'){
    if(b.dataset.on==='1'){stopAll();b.dataset.on='';b.textContent='▶ Abspielen';return;}
    b.dataset.on='1';b.textContent='■ Stopp';
    const items=cardAudio(i,ui.mode[i]);
    playSeq(items).then(()=>{const e=$('plbtn');if(e){e.dataset.on='';e.textContent='▶ Nochmals';}});
  }
  else if(a==='pred'){ui.pick[i]=+b.dataset.i;S.seen[i]=true;render();}
  else if(a==='wstep'){ui.wk[i]=(ui.wk[i]||0)+1;render();}
  else if(a==='est'){ui.sp.est=+b.dataset.i;render();}
  else if(a==='swstart')swStart();
  else if(a==='swstop')swStop();
  else if(a==='example'){measure(8,60,22);}
  else if(a==='spagain'){ui.sp.t=null;ui.sp.est=null;S.sprint=null;render();}
  else if(a==='practice')startRound();
  else if(a==='qopt')answerMC(+b.dataset.i);
  else if(a==='qcheck')checkNum();
  else if(a==='hint'){const el=$('ans');if(el)ui.R.input=el.value;ui.R.hint=true;ui.R.usedHint=true;render();}
  else if(a==='saytipp')sayList(['tipp-'+ui.R.q.topic]);
  else if(a==='sayfb')sayList(ui.R.sayIds||[FB_OK[0]]);
  else if(a==='qnext')nextQ();
  else if(a==='quit'){save();ui.screen='home';render();}
  else if(a==='code'){ui.codeErr=null;makeCode().then(c=>{ui.code=c;try{ui.qr=qrSvg(c);}catch(e){ui.qr=null;}render();}).catch(()=>{ui.code=null;ui.qr=null;ui.codeErr='Der Code kann hier nicht erzeugt werden. Öffne die Seite über https im Browser.';render();});}
  else if(a==='cliplist'){
    const out=Object.keys(CLIPS).map(k=>({id:k,voice:CLIPS[k].voice,text:CLIPS[k].text}));
    const txt=JSON.stringify(out,null,1),msg=$('cpmsg');
    try{navigator.clipboard.writeText(txt).then(()=>{if(msg)msg.textContent=out.length+' Clips kopiert.';},()=>{if(msg)msg.textContent='Kopieren nicht möglich.';});}catch(e){if(msg)msg.textContent='Kopieren nicht möglich.';}
  }
  else if(a==='reset'){if(ui.confirmReset){S=defaults();save();ui.confirmReset=false;ui.pick={};ui.wk={};ui.sp={est:null,m:60,st:22,run:false,t0:0,t:null};}else ui.confirmReset=true;render();}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;onAct(b);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='ans'){e.preventDefault();checkNum();}});
window.addEventListener('hashchange',render);
try{speechSynthesis.getVoices();}catch(e){}
render();
})();
</script>
